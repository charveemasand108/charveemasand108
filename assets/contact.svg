  <circle r="46" fill="none" stroke="#F75C7E" stroke-width="2"><animate attributeName="r" values="46;92" dur="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle r="46" fill="none" stroke="#F75C7E" stroke-width="2"><animate attributeName="r" values="46;92" dur="2.8s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="2.8s" begin="1.4s" repeatCount="indefinite"/></circle>
  <circle r="46" fill="url(#av)"/>
  <text y="16" text-anchor="middle" font-size="46" font-weight="700" fill="#fff">C</text>
</g>
<text x="450" y="290" text-anchor="middle" font-size="14" font-weight="600" letter-spacing="2" fill="#F75C7E">SHARE VIA</text>
<rect x="120" y="304" width="660" height="212" rx="28" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".14"/>

<g transform="translate(146 331)"><rect width="36" height="36" rx="9" fill="url(#c0)"/><text x="18" y="27" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">in</text></g>
