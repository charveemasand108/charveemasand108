<svg xmlns="http://www.w3.org/2000/svg" width="900" height="545" viewBox="0 0 900 545" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1022"/><stop offset=".55" stop-color="#2f1536"/><stop offset="1" stop-color="#4a1d45"/></linearGradient>
<radialGradient id="bPink"><stop offset="0" stop-color="#F75C7E" stop-opacity=".55"/><stop offset="1" stop-color="#F75C7E" stop-opacity="0"/></radialGradient>
<radialGradient id="bLilac"><stop offset="0" stop-color="#8E6BFF" stop-opacity=".45"/><stop offset="1" stop-color="#8E6BFF" stop-opacity="0"/></radialGradient>
<radialGradient id="bPeach"><stop offset="0" stop-color="#FFB199" stop-opacity=".32"/><stop offset="1" stop-color="#FFB199" stop-opacity="0"/></radialGradient>
<linearGradient id="pinkGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A5C"/><stop offset="1" stop-color="#F75C7E"/></linearGradient>
<clipPath id="clip"><rect width="900" height="545" rx="36"/></clipPath><linearGradient id="av" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9A5C"/><stop offset="1" stop-color="#F75C7E"/></linearGradient><linearGradient id="c0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A8FE8"/><stop offset="1" stop-color="#084A8F"/></linearGradient><linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A5C"/><stop offset="1" stop-color="#F75C7E"/></linearGradient><linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34344a"/><stop offset="1" stop-color="#0d0d14"/></linearGradient></defs>

<g clip-path="url(#clip)">
<rect width="900" height="545" fill="url(#bg)"/>

<circle cx="140" cy="153" r="280" fill="url(#bPink)"><animate attributeName="cx" values="140;260;140" dur="10s" repeatCount="indefinite"/><animate attributeName="cy" values="153;272;153" dur="10s" repeatCount="indefinite"/></circle>
<circle cx="760" cy="191" r="260" fill="url(#bLilac)"><animate attributeName="cx" values="760;640;760" dur="12s" repeatCount="indefinite"/></circle>
<circle cx="450" cy="555" r="300" fill="url(#bPeach)"><animate attributeName="cy" values="555;505;555" dur="8s" repeatCount="indefinite"/></circle>

<rect x="390" y="18" width="120" height="6" rx="3" fill="#fff" fill-opacity=".4"/>
<text x="450" y="92" text-anchor="middle" font-size="42" font-weight="700" fill="#fff">Let's work together</text>
<text x="450" y="126" text-anchor="middle" font-size="18" fill="#fff" fill-opacity=".7">Open to collaborations &amp; exciting product ideas in iOS, web and AI</text>
