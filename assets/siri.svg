<radialGradient id="o3"><stop offset="0" stop-color="#4DD8E8"/><stop offset="1" stop-color="#4DD8E8" stop-opacity="0"/></radialGradient>
<clipPath id="orb"><circle cx="0" cy="0" r="72"/></clipPath></defs>

<g clip-path="url(#clip)">
